<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dodi Sitorus | Fullstack Developer</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8f9fa; }
        .hero-section { background: linear-gradient(135deg, #0d6efd, #00d4ff); color: white; padding: 100px 0; }
        .card { border: none; transition: 0.3s; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .card:hover { transform: translateY(-10px); }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
    <div class="container">
        <a class="navbar-brand fw-bold" href="#">Rs.<span class="text-info">Permata Hati</span>❤</a>
        
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        
        <div class="collapse navbar-collapse" id="navbarNav">
            <div class="navbar-nav ms-auto text-center">
                <a class="nav-link active" href="#">Home</a>
                <a class="nav-link" href="#skills">Skills</a>
                <a class="nav-link" href="#contact">Contact</a>
            </div>
        </div>
    </div>
</nav>


    <header class="hero-section text-center">
        <div class="container">
            <h1 class="display-3 fw-bold">Selamat Datang</h1>
            <p class="lead">Membangun Solusi Digital dari Asahan untuk Dunia</p>
            <a href="#skills" class="btn btn-light btn-lg px-5 mt-3 rounded-pill shadow">Mulai Belajar</a>
        </div>
    </header>

    <section id="contact" class="py-5 bg-white">
    <div class="container">
        <h2 class="text-center mb-5 fw-bold">Hubungi Saya</h2>
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card p-4">
                    <form action="https://formspree.io/f/EMAIL_KAMU" method="POST">
                        <div class="mb-3">
                            <label class="form-label">Nama Lengkap</label>
                            <input type="text" name="name" class="form-control" placeholder="Masukkan nama Anda" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Alamat Email</label>
                            <input type="email" name="_replyto" class="form-control" placeholder="nama@email.com" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Pesan</label>
                            <textarea name="message" class="form-control" rows="4" placeholder="Apa yang ingin Anda sampaikan?" required></textarea>
                        </div>
                        <button type="submit" class="btn btn-primary w-100 py-2 fw-bold">Kirim Pesan</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</section>

<footer class="py-4 bg-dark text-white text-center">
    <div class="container">
        <p class="mb-0">&copy; 2026 Dodi Sahbudi Sitorus. All Rights Reserved.</p>
    </div>
</footer>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
